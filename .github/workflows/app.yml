name: App

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app.yml"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (a commit SHA) to redeploy. Leave empty to build this commit."
        required: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: tflab-app
  cancel-in-progress: false

env:
  IMAGE: tflab-app

jobs:
  build:
    if: ${{ !inputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to the registry
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Build and push
        run: |
          REF="${{ vars.ACR_NAME }}.azurecr.io/$IMAGE:${{ github.sha }}"
          docker build --build-arg GIT_SHA=${{ github.sha }} -t "$REF" app
          docker push "$REF"

  deploy:
    needs: build
    if: ${{ always() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - run: az extension add --name containerapp --upgrade --only-show-errors

      - name: Deploy the image
        run: |
          TAG="${{ inputs.tag || github.sha }}"
          az containerapp update \
            --name ca-tflab-app \
            --resource-group rg-tflab-dev \
            --image "${{ vars.ACR_NAME }}.azurecr.io/$IMAGE:$TAG"