name: Terraform Plan

on:
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  plan:
    strategy:
      fail-fast: false            # one broken environment must not hide the other
      matrix:
        environment: [dev, prod]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: envs/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.1"

      - run: terraform fmt -check -recursive
        working-directory: .       # formatting is checked across the whole repo

      - run: terraform init
      - run: terraform validate

      - id: plan
        run: terraform plan -no-color -input=false

      - uses: actions/github-script@v7
        if: always()
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}
          ENVIRONMENT: ${{ matrix.environment }}
        with:
          script: |
            const body = [
              '#### Terraform plan — `' + process.env.ENVIRONMENT + '` — ' + '${{ steps.plan.outcome }}',
              '',
              '<details><summary>Show plan</summary>',
              '',
              '```terraform',
              (process.env.PLAN || '').slice(0, 60000),
              '```',
              '',
              '</details>'
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });