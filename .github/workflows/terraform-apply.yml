name: Terraform Apply

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  dev:
    runs-on: ubuntu-latest
    environment: dev               # no reviewers: applies straight away
    concurrency:
      group: tflab-state-dev
      cancel-in-progress: false
    defaults:
      run:
        working-directory: envs/dev
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.1"
      - run: terraform init
      - run: terraform apply -auto-approve -input=false

  prod:
    needs: dev                     # production only after development succeeded
    runs-on: ubuntu-latest
    environment: prod              # required reviewer: waits for you
    concurrency:
      group: tflab-state-prod
      cancel-in-progress: false
    defaults:
      run:
        working-directory: envs/prod
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.1"
      - run: terraform init
      - run: terraform apply -auto-approve -input=false