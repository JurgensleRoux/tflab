name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to destroy"
        type: choice
        options: [dev, prod]
        required: true
      confirm:
        description: "Type the environment name again to confirm"
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: tflab-state-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  destroy:
    if: inputs.confirm == inputs.environment
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: envs/${{ inputs.environment }}
    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: true
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Init
        run: terraform init

      - name: Plan destroy
        run: terraform plan -destroy -input=false -out=tfdestroy

      - name: Destroy
        run: terraform apply -input=false -auto-approve tfdestroy
